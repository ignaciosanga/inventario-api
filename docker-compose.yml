services:
  db:
    image: postgres:16-alpine
    container_name: inventario-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - inventario-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventario}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  inventario-service:
    build:
      context: ./src/InventarioService
    container_name: inventario-service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-inventario};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventario-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./src/ApiGateway
    container_name: inventario-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__inventario__Destinations__principal__Address: http://inventario-service:8080/
      Jwt__Key: ${JWT_KEY:-clave-super-secreta-para-el-examen-api-gateway-2026}
      Auth__Usuario: ${AUTH_USUARIO:-admin}
      Auth__Clave: ${AUTH_CLAVE:-admin123}
    depends_on:
      inventario-service:
        condition: service_healthy
    networks:
      - inventario-net
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  inventario-net:
    driver: bridge

volumes:
  pgdata:
